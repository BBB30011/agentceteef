[project]
name = "ctf-agent"
version = "0.2.0"
description = "Agent CeTeEf — High-Performance Autonomous CTF Multi-Model Solver Swarm"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai[bedrock]>=2.57.0",
    "pydantic-settings>=2.0.0",
    "genai-prices>=0.1.10",
    "boto3>=1.34.0",
    "aiodocker>=0.23.0",
    "claude-agent-sdk>=0.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "markdownify>=0.12.0",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
ctf-solve = "backend.cli:main"
ctf-msg = "backend.cli:msg"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PTH"]
ignore = ["E501", "SIM102", "SIM105", "SIM115", "PTH123"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

